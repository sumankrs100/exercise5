# Main Traefik Configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: true  # Set to false in production and use proper auth

# Entry Points
entryPoints:
  web:
    address: ":80"

# Providers
providers:
  # Docker provider (for future container-based services)
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik-network"
    watch: true

  # File provider for external services
  file:
    directory: /etc/traefik
    watch: true

# Logging
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

# Access Logs
accessLog:
  filePath: /var/log/traefik/access.log
  format: json

# Metrics (optional - uncomment if you want to enable metrics)
# metrics:
#   prometheus:
#     addEntryPointsLabels: true
#     addServicesLabels: true

# Ping endpoint for health checks
ping:
  entryPoint: "web"
