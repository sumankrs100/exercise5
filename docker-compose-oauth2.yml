version: '3.8'

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
      - ./logs:/var/log/traefik
      - ./certs:/etc/ssl/traefik:ro
    networks:
      - traefik-network
    command:
      - --configFile=/etc/traefik/traefik.yml
    labels:
      - "traefik.enable=true"
      # Dashboard route via HTTP (port 8080) only
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/`)"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Optional: Add basic auth for dashboard security
      # - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      # - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$2y$$10$$..."

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: unless-stopped
    networks:
      - traefik-network
    environment:
      # OAuth2 Proxy Configuration
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_METRICS_ADDRESS: "0.0.0.0:44180"
      
      # Keycloak OIDC Configuration
      OAUTH2_PROXY_PROVIDER: "keycloak-oidc"
      OAUTH2_PROXY_CLIENT_ID: "your-client-id"  # Replace with your Keycloak client ID
      OAUTH2_PROXY_CLIENT_SECRET: "your-client-secret"  # Replace with your Keycloak client secret
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://your-keycloak-server/realms/your-realm-name"  # Replace with your Keycloak URL
      
      # Redirect and Cookie Configuration
      OAUTH2_PROXY_REDIRECT_URL: "https://auth.yourdomain.com/oauth2/callback"  # Replace with your OAuth2-proxy URL
      OAUTH2_PROXY_COOKIE_SECRET: "your-32-char-random-string-here"  # Generate with: openssl rand -base64 32 | tr -d "=+/" | cut -c1-32
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".yourdomain.com"  # Replace with your domain
      
      # Email and User Configuration
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"  # Allow all email domains, or specify your domain
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".yourdomain.com"  # Replace with your domain
      
      # Security Configuration
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "false"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      
      # Session Configuration
      OAUTH2_PROXY_SESSION_STORE_TYPE: "cookie"
      OAUTH2_PROXY_COOKIE_EXPIRE: "1h"
      OAUTH2_PROXY_COOKIE_REFRESH: "30m"
      
      # Upstream Configuration
      OAUTH2_PROXY_UPSTREAMS: "static://202"  # Static upstream for auth-only mode
      
      # Logging
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"

      # OIDC Audience Fix - IMPORTANT FOR KEYCLOAK
      OAUTH2_PROXY_OIDC_AUDIENCE_CLAIMS: "aud"
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "groups" 
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "false"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: "email"
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      # Allow multiple audiences including broker and account
      OAUTH2_PROXY_EXTRA_JWT_ISSUERS: "https://your-keycloak-server/realms/your-realm-name=broker,account,your-client-id"
      
    labels:
      - "traefik.enable=true"
      # OAuth2-proxy auth service
      - "traefik.http.routers.oauth2-proxy.rule=Host(`auth.yourdomain.com`)"  # Replace with your auth subdomain
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.routers.oauth2-proxy.service=oauth2-proxy"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      
      # Auth middleware service for forwarded auth
      - "traefik.http.routers.oauth2-proxy-auth.rule=Host(`auth.yourdomain.com`) && PathPrefix(`/oauth2/auth`)"
      - "traefik.http.routers.oauth2-proxy-auth.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy-auth.tls=true"
      - "traefik.http.routers.oauth2-proxy-auth.service=oauth2-proxy-auth"
      - "traefik.http.services.oauth2-proxy-auth.loadbalancer.server.port=4180"
      
      # Define the forward auth middleware
      - "traefik.http.middlewares.oauth2-auth.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.trustforwardheader=true"
      - "traefik.http.middlewares.oauth2-auth.forwardauth.authresponseheaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Access-Token,Authorization"

networks:
  traefik-network:
    external: true
