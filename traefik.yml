global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
  file:
    filename: /etc/traefik/config.yml
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        domains:
          - main: "your-internal-domain"
            sans:
              - "*.your-internal-domain"

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: internal
        certFile: "/etc/traefik/certificates/cert.pem"
        keyFile: "/etc/traefik/certificates/key.pem"