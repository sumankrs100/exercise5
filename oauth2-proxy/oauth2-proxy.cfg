# OAuth2-Proxy Configuration
# Save this as ./oauth2-proxy/oauth2-proxy.cfg

# Basic Configuration
http_address = "0.0.0.0:4180"
reverse_proxy = true
real_client_ip_header = "X-Forwarded-For"

# Keycloak OIDC Configuration
provider = "keycloak"
client_id = "your-oauth2-proxy-client-id"
client_secret = "your-oauth2-proxy-client-secret"

# Keycloak URLs (replace with your Keycloak server details)
oidc_issuer_url = "https://your-keycloak-server.com/realms/your-realm"
login_url = "https://your-keycloak-server.com/realms/your-realm/protocol/openid-connect/auth"
redeem_url = "https://your-keycloak-server.com/realms/your-realm/protocol/openid-connect/token"
profile_url = "https://your-keycloak-server.com/realms/your-realm/protocol/openid-connect/userinfo"
validate_url = "https://your-keycloak-server.com/realms/your-realm/protocol/openid-connect/userinfo"

# Redirect URL
redirect_url = "https://auth.yourdomain.com/oauth2/callback"

# Scopes - This is key for getting groups and additional claims
scope = "openid profile email groups roles"

# Cookie Configuration
cookie_name = "_oauth2_proxy"
cookie_secret = "your-32-char-random-string-here"
cookie_domains = ".yourdomain.com"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Session Configuration
cookie_expire = "24h"
cookie_refresh = "1h"

# Security
email_domains = "*"  # Allow all email domains, or specify your domain

# Skip auth for specific paths (if needed)
skip_auth_regex = "^/health|^/ping"

# Headers to pass to upstream
set_xauthrequest = true
set_authorization_header = true
pass_authorization_header = true
pass_access_token = true
pass_user_headers = true

# Additional claims to extract from JWT token
jwt_key = ""  # Will be auto-discovered from OIDC issuer
pass_claim_headers = true

# Custom claim headers (TOML format)
[claim_headers]
"X-Auth-Request-Groups" = "groups"
"X-Auth-Request-Roles" = "realm_access.roles"
"X-Auth-Request-Preferred-Username" = "preferred_username"
"X-Auth-Request-Given-Name" = "given_name"
"X-Auth-Request-Family-Name" = "family_name"

# Upstream configuration for auth validation
upstreams = [
  "static://202"
]

# Logging
request_logging = true
standard_logging = true
auth_logging = true
